name: my_meds
description: "MyMeds — Informational medication-management app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4

  # Internationalization
  intl: any

  # Environment / Secrets
  flutter_dotenv: ^5.2.1

  # Authentication
  google_sign_in: ^6.2.2

  # Networking & Caching
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # Camera & OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

  # Local Notifications & Timezone
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Data Visualization & Charts
  fl_chart: ^0.69.0

  # Icons and other features
  cupertino_icons: ^1.0.8
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/interactions/